<section id="about"
         itemscope
         itemtype="https://schema.org/AboutPage">
  <div class="about-container"
       itemscope
       itemtype="https://schema.org/Person">
    <!-- structured data properties -->
    <meta itemprop="jobTitle"
          [attr.content]="content?.headline" />
    <meta itemprop="knowsLanguage"
          content="en" />
    <meta itemprop="knowsLanguage"
          content="pt" />
    <meta itemprop="nationality"
          content="Brazil" />
    <meta itemprop="email"
          content="davidjfds@gmail.com" />
    <meta itemprop="url"
          content="https://davidjuan.github.io" />
    <div class="first-column">
      <span class="kicker">{{ content?.kicker }}</span>
      <h1 itemprop="name">{{ name }}</h1>
      <h2 class="headline">{{ content?.headline }}</h2>
      <p class="tagline">{{ content?.tagline }}</p>
      <p class="location"
         *ngIf="content?.location">
        <fa-icon [icon]="['fas', 'map-marker-alt']"
                 class="location-icon"></fa-icon>
        <span itemprop="homeLocation">{{ content?.location }}</span>
      </p>
      <p class="text"
         itemprop="description"
         [innerHTML]="content?.description || 'Loading...'"></p>
      <div class="actions">
        <a class="btn btn-primary"
           [href]="resume.href"
           [attr.download]="resume.fileName"
           type="application/pdf">
          <fa-icon [icon]="['fas', 'download']"></fa-icon>
          <span>{{ content?.cv?.download }}</span>
        </a>
        <a class="btn btn-secondary"
           [href]="otherResume.href"
           [attr.download]="otherResume.fileName"
           type="application/pdf">
          <fa-icon [icon]="['fas', 'file-pdf']"></fa-icon>
          <span>{{ content?.cv?.other }}</span>
        </a>
        <div class="social-media">
          <a *ngFor="let media of aboutData?.medias"
             href="{{ media.http }}"
             target="_blank"
             rel="noopener"
             [attr.aria-label]="media.title"
             itemprop="sameAs">
            <fa-icon [icon]="['fab', media.icon]"
                     class="icon"
                     title="{{ media.title }}"></fa-icon>
          </a>
        </div>
      </div>
    </div>
    <div class="second-column">
      <div class="profile-picture"
           role="img"
           [attr.aria-label]="name"></div>
    </div>
  </div>
  <ul class="metrics"
      *ngIf="content?.metrics?.length">
    <li *ngFor="let metric of content.metrics">
      <strong>{{ metric.value }}</strong>
      <span>{{ metric.label }}</span>
    </li>
  </ul>
</section>
