  <script>
    // Sends visitors to the site version in their browser language (Portuguese or English).
    (function () {
      var languages = navigator.languages || [navigator.language || ""];
      var prefersPortuguese = false;
      for (var i = 0; i < languages.length; i++) {
        if (/^pt/i.test(languages[i])) { prefersPortuguese = true; break; }

      }
      location.replace((prefersPortuguese ? "/pt/" : "/en/") + location.hash);
    })();
